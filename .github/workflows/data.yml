# Refreshes data/ (season highs, leaders, team stats) from ESPN box scores.
name: Update data
on:
  schedule:
    # Games end by ~1:30 am ET (05:30 UTC). Check every 20 min from 05:00 to
    # 08:59 UTC (5-8 am in Lisbon in winter, 6-9 am in summer), since GitHub
    # often delays or skips scheduled runs; nothing during the day. Off-the-hour
    # minutes because the top of the hour is when GitHub is busiest.
    - cron: '7,27,47 5-8 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: data
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-data.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || { git commit -m "Update data" && git push; }
