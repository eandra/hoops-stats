# Refreshes data/ (stats, highs, records, game logs) from ESPN box scores.
name: Update data
on:
  schedule:
    # GitHub starts scheduled runs late (often hours late) or not at all, so
    # start early and keep going: one run polls every 5 minutes until 09:00
    # UTC (9 am in the Canaries/Lisbon in winter, 10 am in summer). Games end
    # by ~1:30 am ET (05:30 UTC). The second time is a backup in case the
    # first is dropped; if the first is still running it just waits its turn
    # and does one pass. Off-the-hour minutes: the top of the hour is busiest.
    - cron: '17 1 * * *'
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: data
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Update data until 09:00 UTC
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          recheck=3
          while :; do
            RECHECK_DAYS=$recheck node scripts/build-data.mjs
            git add data
            if ! git diff --cached --quiet; then
              git commit -qm "Update data"
              git pull -q --rebase && git push -q
            fi
            recheck=0
            # Manual runs during the day do a single pass.
            [ "$(date -u +%H)" -lt 9 ] || break
            sleep 300
          done
